services:
  auth-service:
    build:
      context: .                       # API/ root, so shared/ is visible
      dockerfile: auth-service/Dockerfile
    env_file: auth-service/.env
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    env_file: user-service/.env
    ports:
      - "8082:8080"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: auth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: