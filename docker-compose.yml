
services:
  postgres:
    image: postgres:17
    container_name: deployflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deployflow_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    env_file:
      - ./auth-service/.env
    environment:
      USER_SERVICE_URL: http://user-service:8082
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    env_file:
      - ./user-service/.env
    ports:
      - "8082:8082"
    depends_on:
      - postgres
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    env_file:
      - ./api-gateway/.env
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - user-service
    restart: unless-stopped

volumes:
  postgres_data:
